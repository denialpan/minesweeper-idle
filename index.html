<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside id="debug-panel">
        <label for="debug-enabled">
            <input id="debug-enabled" type="checkbox">
            Debug
        </label>
        <div id="debug-controls" hidden>
            <button id="debug-reset-save" type="button">
                Reset local save
            </button>
            <button id="debug-force-win" type="button">Force win</button>
            <button id="debug-force-loss" type="button">Force loss</button>
            <button id="debug-force-bad-flags" type="button">
                Mine hit with incorrect flags
            </button>
            <label for="debug-currency">Mines defused</label>
            <input
                id="debug-currency"
                type="number"
                min="0"
                step="0.01"
                value="0"
            >
            <button id="debug-set-currency" type="button">
                Set currency
            </button>
        </div>
    </aside>
    <section
        id="action-console"
        role="log"
        aria-label="Recent game actions"
        aria-live="polite"
    ></section>
    <main>
        <p>Mines defused: <output id="mines-defused">0</output></p>
        <div id="game">
            <div id="board-column">
                <div id="board">
                    <canvas id="minesweeper" width="112" height="112" aria-label="7 by 7 Minesweeper grid"></canvas>
                    <div id="game-result" role="status" aria-live="polite" hidden>
                        <p id="game-result-message"></p>
                        <button id="reset-game" type="button">new board</button>
                    </div>
                </div>
            </div>
            <div id="upgrade-controls">
                <button id="unlock-auto-solver" type="button">
                    Unlock auto solver (10 mines)
                </button>
                <button id="upgrade-auto-solver-speed" type="button" hidden>
                    Auto solve speed 1.00× → 1.10× (250 mines)
                </button>
                <button
                    id="unlock-auto-solver-expansion"
                    type="button"
                    hidden
                >
                    Unlock auto solve expansion (1000 mines)
                </button>
                <button id="unlock-auto-solver-random" type="button" hidden>
                    Unlock random auto solve (100 mines)
                </button>
                <button id="unlock-auto-reset" type="button">
                    Unlock auto reset (10 mines)
                </button>
                <button id="upgrade-auto-reset-speed" type="button" hidden>
                    Auto reset speed 1.00× → 1.50× (100 mines)
                </button>
                <button id="unlock-board-9x9" type="button">
                    Unlock 9x9 board (25 mines)
                </button>
                <button id="unlock-first-click-safe" type="button">
                    Unlock first click safe (50 mines)
                </button>
            </div>
            <div id="toggle-controls">
                <div id="zoom-controls">
                    <div id="zoom-row">
                        <label for="zoom-input">Zoom:</label>
                        <input
                            id="zoom-input"
                            type="number"
                            min="0.5"
                            max="5"
                            value="1"
                            step="0.01"
                        >
                        <button id="reset-zoom" type="button" title="Reset zoom" aria-label="Reset zoom">↺</button>
                        <button id="set-default-zoom" type="button" title="Set current zoom as default" aria-label="Set current zoom as default">★</button>
                    </div>
                </div>
                <label id="solver-control" for="solver-enabled" hidden>
                    <input id="solver-enabled" type="checkbox" checked disabled>
                    auto solve
                </label>
                <label
                    id="solver-algorithm-control"
                    for="solver-algorithm"
                    hidden
                >
                    Algorithm:
                    <select id="solver-algorithm">
                        <option value="sequential">Sequential</option>
                        <option
                            id="solver-algorithm-random"
                            value="random"
                            hidden
                            disabled
                        >
                            Random
                        </option>
                    </select>
                </label>
                <label id="auto-reset-control" for="auto-reset-enabled" hidden>
                    <input id="auto-reset-enabled" type="checkbox" disabled>
                    auto reset after 1 second
                </label>
            </div>
        </div>
    </main>

    <script src="src/game/board-generator.js"></script>
    <script src="src/game/minesweeper-game.js"></script>
    <script src="src/rendering/sprites.js"></script>
    <script src="src/rendering/canvas-renderer.js"></script>
    <script src="src/rendering/action-console.js"></script>
    <script src="src/input/mouse-controller.js"></script>
    <script src="src/solvers/auto-solver.js"></script>
    <script src="src/progression/upgrade-definitions.js"></script>
    <script src="src/progression/progression-rules.js"></script>
    <script src="src/progression/progression-store.js"></script>
    <script src="src/config.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
